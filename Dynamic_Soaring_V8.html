<div class="pair">

</aside>

window.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'||e.target.tagName==='BUTTON')return;if(e.code==='Space'){e.preventDefault();playing=!playing;lastMs=null;sync()}if(e.key==='ArrowRight'){e.preventDefault();seek(time+(e.shiftKey?5:1))}if(e.key==='ArrowLeft'){e.preventDefault();seek(time-(e.shiftKey?5:1))}});
window.addEventListener('resize',()=>draw(time,true));document.addEventListener('visibilitychange',()=>{lastMs=null});
function animate(ms){if(lastMs===null)lastMs=ms;const dt=Math.min(.10,(ms-lastMs)/1000);lastMs=ms;if(playing&&!scrubbing&&!document.hidden){time+=dt*rate;if(time>=TOTAL){time%=TOTAL;lastCaption=-1;lastPhase=-1}}draw(time);requestAnimationFrame(animate)}
window.demoSeek=t=>{playing=false;sync();seek(t)};window.demoResume=()=>{playing=true;lastMs=null;sync()};window.demoPause=()=>{playing=false;sync()};window.demoSetRate=setRate;
window.demoPlanAudit=t=>{const st=stateAt(t),prev=stateAt(Math.max(0,t-.001)),next=stateAt(Math.min(TOTAL,t+.001));return {t,phase:st.phase,tau:st.tau,pos:st.pos,psi:st.psi,air:st.air,ground:st.ground,deltaPosToModel:norm(sub(st.pos,stateAtPhysical(st.tau).pos)),psiYawDisplay:-st.psi,instantPositionContinuity:Math.hypot(next.pos.x-prev.pos.x,next.pos.y-prev.pos.y),source:'stateAt(t) shared by renderWorld and planView'};};
window.demoStatus=()=>({time,rate,playing,phase:phaseAt(time),frames:frameCount,caption:$('subtitle').textContent});
window.demoState=t=>stateAt(t);
window.demoCheck=()=>{let maxForce=0,maxSpeed=0,maxOrtho=0,maxEnergy=0,maxEuler=0,minZ=Infinity,maxV=0,minV=Infinity;for(let tau=0;tau<42;tau+=.037){let s=stateAtPhysical(tau);maxForce=Math.max(maxForce,Math.abs(dot(s.liftHat,s.airHat)),Math.abs(dot(s.dragHat,s.airHat)+1));maxSpeed=Math.max(maxSpeed,norm(sub(s.ground,add(s.air,s.wind))));maxOrtho=Math.max(maxOrtho,Math.abs(dot(s.bodyForward,s.bodyUp)),Math.abs(dot(s.right,s.airHat)),Math.abs(Math.acos(clamp(dot(s.bodyForward,s.airHat),-1,1))-s.alpha));maxEnergy=Math.max(maxEnergy,Math.abs(s.de-(s.ws-s.wd)));maxEuler=Math.max(maxEuler,Math.abs(Math.sin(s.gammaA)-(Math.cos(s.alpha)*Math.sin(s.theta)-Math.sin(s.alpha)*Math.cos(s.phi)*Math.cos(s.theta))));minZ=Math.min(minZ,s.z);maxV=Math.max(maxV,s.V);minV=Math.min(minV,s.V)}let end=DATA.at(-1);return{duration:TOTAL,physicalCycle:M.T,velocityClosure:maxSpeed,liftDragDirectionError:maxForce,bodyGeometryError:maxOrtho,energyClosureJPerKg:maxEnergy,eulerRelationError:maxEuler,minHeight:minZ,minAirspeed:minV,maxAirspeed:maxV,cycleDeltaV:end[0]-M.V0,cycleDeltaZ:end[1]-M.z0,cycleShear:end[4],cycleDrag:-end[5]}};
sync();draw(0,true);requestAnimationFrame(animate);
})();
